<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bitácora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo de Bitácora: el historial técnico del auto asociado a su patente, para compradores, automotoras y talleres.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna (máx. 1080px) con cabecera fija y cambio de rol; en el celular todo apila y los botones crecen */
:root{
  --head:#0B3A45; --head-ink:#EAF4F5; --head-2:rgb(234 244 245 / .10); --head-line:rgb(234 244 245 / .18);
  --brand:#0E5868; --brand-strong:#0A4552; --brand-ink:#FFFFFF; --brand-soft:#E2EEF0;
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F6F9F9;
  --ink:#0F2328; --ink-2:#465B61; --ink-3:#6B7F85; --line:#D6E0E2; --line-2:#E6EDEE;
  --focus:#2E8FA3; --focus-ring:rgb(46 143 163 / .30);
  --ok:#17784A; --ok-bg:#E3F3E9; --ok-line:#A6D8BA;
  --prt:#1F55A6; --prt-bg:#E5EDFA; --prt-line:#B0C7EC;
  --gap:#8F5600; --gap-bg:#FFF2D6; --gap-line:#E3AC48;
  --risk:#B1261D; --risk-bg:#FCEAE8; --risk-line:#EFAAA3;
  --own:#5C6A70; --own-bg:#ECF0F1; --own-line:#CCD5D8;
  --plate-bg:#FFFFFF; --plate-ink:#121417; --plate-line:#1E2226; --plate-ph:#B4BCBF;
  --paper:#FFFFFF; --paper-ink:#10232A; --paper-line:#D8E2E4; --paper-muted:#5B6E74;
  --paper-gap:#8F5600; --paper-gap-bg:#FFF2D6; --paper-risk:#B1261D; --paper-ok:#17784A;
  --mark-bg:#EAF4F5; --mark-ink:#0B3A45; --mark-ok:#1F9D61; --mark-prt:#2F6FD0; --mark-gap:#E29A1C;
  --shadow:0 1px 2px rgb(11 58 69 / .06), 0 6px 20px rgb(11 58 69 / .07);
  --backdrop:rgb(4 18 22 / .55);
  --font-display:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --head:#071F25; --head-ink:#DCEBEE; --head-2:rgb(220 235 238 / .08); --head-line:rgb(220 235 238 / .16);
    --brand:#4FB0C2; --brand-strong:#7CC8D6; --brand-ink:#04222A; --brand-soft:#11353D;
    --bg:#0B171A; --surface:#11242A; --surface-2:#0E1F24;
    --ink:#E4EEF0; --ink-2:#A6BAC0; --ink-3:#7E959B; --line:#24424B; --line-2:#1A333B;
    --focus:#6CC6D6; --focus-ring:rgb(108 198 214 / .30);
    --ok:#5CC48E; --ok-bg:#10301F; --ok-line:#215A3B;
    --prt:#86AEF0; --prt-bg:#122444; --prt-line:#2A4980;
    --gap:#F1B54C; --gap-bg:#33250A; --gap-line:#7A5719;
    --risk:#F38A80; --risk-bg:#3B1512; --risk-line:#742C26;
    --own:#A2B0B5; --own-bg:#1C2B30; --own-line:#36484F;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    --backdrop:rgb(0 0 0 / .62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --head:#071F25; --head-ink:#DCEBEE; --head-2:rgb(220 235 238 / .08); --head-line:rgb(220 235 238 / .16);
  --brand:#4FB0C2; --brand-strong:#7CC8D6; --brand-ink:#04222A; --brand-soft:#11353D;
  --bg:#0B171A; --surface:#11242A; --surface-2:#0E1F24;
  --ink:#E4EEF0; --ink-2:#A6BAC0; --ink-3:#7E959B; --line:#24424B; --line-2:#1A333B;
  --focus:#6CC6D6; --focus-ring:rgb(108 198 214 / .30);
  --ok:#5CC48E; --ok-bg:#10301F; --ok-line:#215A3B;
  --prt:#86AEF0; --prt-bg:#122444; --prt-line:#2A4980;
  --gap:#F1B54C; --gap-bg:#33250A; --gap-line:#7A5719;
  --risk:#F38A80; --risk-bg:#3B1512; --risk-line:#742C26;
  --own:#A2B0B5; --own-bg:#1C2B30; --own-line:#36484F;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  --backdrop:rgb(0 0 0 / .62);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
body.no-scroll{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,1.2rem + 1.9vw,2.4rem);font-stretch:108%;font-weight:760}
h2{font-size:1.3rem;font-stretch:104%;font-weight:720}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:100%;max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-2)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:60ch}
.fine{font-size:.82rem;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}
.fine .ic{margin-top:2px}
.tx-ok{color:var(--ok)} .tx-gap{color:var(--gap)} .tx-risk{color:var(--risk)} .tx-own{color:var(--own)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Cabecera y modo demo ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px}
.logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-family:var(--font-display);font-weight:800;font-stretch:115%;font-size:1.28rem;letter-spacing:-.01em;border-radius:8px}
.logo-mark{width:30px;height:30px;flex:none}
.lm-bg{fill:var(--mark-bg)} .lm-rail,.lm-ln{stroke:var(--mark-ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.lm-d1{fill:var(--mark-ok)} .lm-d2{fill:var(--mark-prt)} .lm-d3{fill:var(--mark-gap)}
.demo{display:flex;align-items:center;gap:10px}
.demo-label{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;opacity:.78;white-space:nowrap}
.seg{display:flex;background:var(--head-2);border:1px solid var(--head-line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:999px;font-size:.88rem;font-weight:600;min-height:36px;white-space:nowrap}
.seg button:hover{background:var(--head-2)}
.seg button[aria-current="page"]{background:var(--head-ink);color:var(--head)}
@media (max-width:640px){
  .topbar-in{padding-block:8px 10px}
  .demo{width:100%}
  .seg{flex:1}
  .seg button{flex:1;padding-inline:4px;font-size:.84rem}
}

main{padding-block:24px 56px;display:block}
main:focus{outline:none}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font-weight:650;font-size:.98rem;line-height:1.2;text-decoration:none;text-align:center;transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-lg{min-height:56px;font-size:1.05rem;padding-inline:22px;border-radius:14px}
.btn-sm{min-height:38px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.link-btn{background:none;border:0;padding:6px 0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn .ic{width:20px;height:20px}

/* ---------- Patente ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--plate-bg);color:var(--plate-ink);border:2px solid var(--plate-line);border-radius:8px;padding:3px 12px 5px;line-height:1;white-space:nowrap;flex:none}
.plate small{font-size:.5rem;font-weight:700;letter-spacing:.34em;padding-left:.34em;margin-bottom:2px}
.plate b{font-family:var(--font-display);font-stretch:72%;font-weight:700;font-size:1.75rem;letter-spacing:.05em}
.plate--sm{padding:2px 7px 3px;border-radius:5px;border-width:1.5px}
.plate--sm small{font-size:.36rem;letter-spacing:.26em;padding-left:.26em;margin-bottom:1px}
.plate--sm b{font-size:1.02rem}
.plate-input{display:flex;flex-direction:column;align-items:center;background:var(--plate-bg);border:2.5px solid var(--plate-line);border-radius:12px;padding:5px 12px 6px;min-width:0}
.plate-input small{font-size:.56rem;font-weight:700;letter-spacing:.36em;padding-left:.36em;color:var(--plate-ink)}
.plate-input input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--font-display);font-stretch:72%;font-weight:700;font-size:2.1rem;letter-spacing:.06em;color:var(--plate-ink);text-transform:uppercase;padding:0;line-height:1.15;outline:none}
.plate-input input::placeholder{color:var(--plate-ph)}
.plate-input:focus-within{box-shadow:0 0 0 4px var(--focus-ring)}
.buscar-form{display:flex;flex-wrap:wrap;gap:10px;max-width:580px;margin-top:16px}
.buscar-form .plate-input{flex:1 1 250px}
.buscar-form .btn{flex:1 0 150px}
.ejemplos{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:.88rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--ink);min-height:36px}
.chip b{font-family:var(--font-display);font-stretch:78%;font-weight:700;font-size:.98rem;letter-spacing:.04em}
.chip span{color:var(--ink-3)}
.chip:hover{border-color:var(--brand)}

/* ---------- Tarjetas y avisos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
@media (max-width:520px){.card{padding:16px;border-radius:16px}}
.msg{display:flex;gap:14px;align-items:flex-start;margin-top:20px}
.msg-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.msg-ic .ic{width:22px;height:22px}
.msg-body{display:grid;gap:8px;min-width:0}
.msg-body .row{margin-top:6px}

/* ---------- Landing ---------- */
.hero{display:grid;gap:30px;grid-template-areas:"txt" "roles" "demo"}
.hero-txt{grid-area:txt;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero-txt h1{font-size:clamp(2.15rem,1.3rem + 4vw,3.7rem);font-stretch:114%;font-weight:800;line-height:1.02;letter-spacing:-.025em;max-width:13ch}
.hero-points{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hero-points span{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.roles{grid-area:roles;display:grid;gap:12px}
.roles-title{font-size:1.05rem;font-stretch:100%;color:var(--ink-2);font-weight:650}
.roles-grid{display:grid;gap:12px}
.rol{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.rol-top{display:flex;align-items:center;gap:12px}
.rol-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.rol-ic .ic{width:22px;height:22px}
.rol-para{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.rol-ben{font-size:1.02rem;flex:1}
.rol .btn{justify-content:space-between}
.hero-demo{grid-area:demo;min-width:0}
.demo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;--tl-bg:var(--surface)}
.demo-card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demo-card-head .dc-veh{flex:1;min-width:0}
.demo-card-head .dc-veh b{display:block;font-family:var(--font-display);font-size:1.05rem}
.demo-card-head .dc-veh span{font-size:.84rem;color:var(--ink-2)}
.demo-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:12px}
@media (min-width:760px){.roles-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:920px){
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"txt demo" "roles roles";column-gap:56px;align-items:center}
}

/* ---------- Ficha del vehículo ---------- */
.buscar h1{margin-top:6px}
.ficha{display:flex;flex-direction:column;gap:18px;margin-top:26px;min-width:0}
.ficha-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.ficha-veh{min-width:0}
.ficha-veh h2{font-size:1.5rem}
.ficha-veh .anio{color:var(--ink-3);font-weight:600}
.ficha-veh p{color:var(--ink-2);font-size:.95rem}
.alertas{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1.5px solid;min-width:0}
.alert > div{min-width:0}
.alert-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--surface)}
.alert-ic .ic{width:20px;height:20px;stroke-width:2.2}
.alert-t{font-weight:750;font-size:1.04rem;line-height:1.3;margin-bottom:3px}
.alert-s{font-size:.88rem;color:var(--ink-2);margin-top:4px}
.alert-list{margin:4px 0 0;padding-left:18px;display:grid;gap:2px}
.alert--risk{background:var(--risk-bg);border-color:var(--risk-line)} .alert--risk .alert-ic{background:var(--risk)} .alert--risk .alert-t{color:var(--risk);font-size:1.12rem}
.alert--gap{background:var(--gap-bg);border-color:var(--gap-line)} .alert--gap .alert-ic{background:var(--gap)} .alert--gap .alert-t{color:var(--gap)}
.alert--ok{background:var(--ok-bg);border-color:var(--ok-line)} .alert--ok .alert-ic{background:var(--ok)} .alert--ok .alert-t{color:var(--ok)}
.ficha-grid{display:grid;gap:14px}
@media (min-width:820px){.ficha-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.indice{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.indice-txt{min-width:0;flex:1}
.ring{--c:var(--brand);--p:0;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line-2) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;display:flex;align-items:baseline;gap:1px}
.ring b{font-family:var(--font-display);font-size:1.95rem;font-weight:800;font-stretch:92%;line-height:1;font-variant-numeric:tabular-nums}
.ring small{font-size:.72rem;color:var(--ink-3)}
.ring--sm{width:60px;height:60px}
.ring--sm::before{inset:6px}
.ring--sm b{font-size:1.3rem}
.ring--ok{--c:var(--ok)} .ring--gap{--c:var(--gap)} .ring--own{--c:var(--own)}
.indice-label{font-weight:650;line-height:1.3}
.indice-help{font-size:.9rem;color:var(--ink-2);margin-top:3px}
.calc{margin-top:10px;font-size:.88rem}
.calc summary{cursor:pointer;color:var(--brand);font-weight:650;list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:32px}
.calc summary::-webkit-details-marker{display:none}
.calc summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.calc[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.calc-body{display:grid;gap:12px;margin-top:8px}
.calc-top{display:flex;justify-content:space-between;gap:8px}
.calc small{color:var(--ink-3);display:block;line-height:1.35}
.calc-desc{font-weight:650;color:var(--gap)}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0}
.resumen > div{background:var(--surface);padding:12px 14px;min-width:0}
.resumen dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650}
.resumen dd{margin:3px 0 0;font-family:var(--font-display);font-weight:750;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.resumen dd small{display:block;font-family:var(--font-body);font-weight:450;font-size:.8rem;color:var(--ink-2);margin-top:2px}
.pay-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px 18px;border-radius:16px;background:var(--brand-soft);border:1px solid var(--line)}
.pay-card p{max-width:54ch;font-size:.95rem}
.pay-card b{display:block;font-size:1.02rem;margin-bottom:2px}
.ficha-cta{display:flex;flex-wrap:wrap;gap:10px}
[id],.hist,.ev,.step,.ficha{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:640px){[id],.hist,.ev,.step,.ficha{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 112px)}}
.hist{display:flex;flex-direction:column;gap:12px;min-width:0}
.hist-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.hist-head span{font-size:.86rem;color:var(--ink-3)}
.hist-lock{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:16px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}

/* Línea de tiempo */
.tl{--tl-bg:var(--bg);list-style:none;margin:0;padding:0;position:relative}
.modal .tl,.demo-card .tl{--tl-bg:var(--surface)}
.tl > li{position:relative;padding-left:32px;padding-bottom:12px}

/* ================= Utilidades ================= */

let S = estadoInicial();

const getVeh = p => VEH[p] || S.extraVeh[p] || null;
function eventosDe(p) {
  return (BASE[p] || []).concat(S.extra[p] || []).slice().sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creado || 0) - (b.creado || 0)));
}

const fechaIns = v => (v.insAprox ? 'año ' + v.anio : fecha(v.inscripcion));

/* ================= Índice de trazabilidad ================= */
function analizar(v) {
  const evs = eventosDe(v.patente);
  const a = { evs: evs, gaps: [], incons: [], siniestros: [], score: 0, cov: 0, ver: 0, mant: 0, mantCount: 0, mantEsperadas: 0, desc: 0, last: null, maxKm: 0, nTaller: 0, nPrt: 0, nDueno: 0 };
  if (!evs.length) return a;
  let prev = { fecha: v.inscripcion, km: 0, inscripcion: true };
  evs.forEach(e => {
    const m = meses(prev.fecha, e.fecha), dk = e.km - prev.km;
    if (dk < 0) a.incons.push({ ev: e, prev: prev });
    if (m > 12 || dk > 15000) a.gaps.push({ desde: prev, hasta: e, meses: Math.max(m, 0), km: dk > 0 ? dk : null });
    if (e.tipo === 'sin') a.siniestros.push(e);
    if (e.sello === 'taller') a.nTaller++; else if (e.sello === 'prt') a.nPrt++; else a.nDueno++;
    if (e.tipo === 'mant') a.mantCount++;
    a.maxKm = Math.max(a.maxKm, e.km);
    prev = e;
  });
  a.last = evs[evs.length - 1];
  const cola = meses(a.last.fecha, HOY);
  if (cola > 12) a.gaps.push({ desde: a.last, hasta: null, meses: cola, km: null });
  const total = Math.max(1, meses(v.inscripcion, HOY));
  const enVacio = a.gaps.reduce((s, g) => s + g.meses, 0);
  a.cov = clamp(1 - enVacio / total, 0, 1);
  a.ver = evs.reduce((s, e) => s + PESO[e.sello], 0) / evs.length;
  a.mantEsperadas = Math.max(1, Math.round(Math.max(a.maxKm / 10000, total / 12)));
  a.mant = clamp(a.mantCount / a.mantEsperadas, 0, 1);
  a.desc = a.gaps.length * 10 + a.incons.length * 25;
  a.score = clamp(Math.round(40 * a.cov + 35 * a.ver + 25 * a.mant - a.desc), 0, 100);
  return a;
}
function banda(a) {
  if (!a.evs.length) return { t: 'Sin registros', cls: 'own' };
  if (a.score >= 80) return { t: 'Alta', cls: 'ok' };
  if (a.score >= 50) return { t: 'Media', cls: 'gap' };
  return { t: 'Baja', cls: 'gap' };
}

function calcHTML(a) {
  const row = (lbl, pct, hint) => '<div><div class="calc-top"><span>' + lbl + '</span><b>' + Math.round(pct * 100) + ' %</b></div><div class="bar"><i style="width:' + Math.round(pct * 100) + '%"></i></div><small>' + hint + '</small></div>';
  const partes = [];
  if (a.gaps.length) partes.push(a.gaps.length + (a.gaps.length === 1 ? ' período' : ' períodos') + ' sin registros');
  if (a.incons.length) partes.push(a.incons.length + ' inconsistencia de kilometraje');
  return '<details class="calc"><summary>¿Cómo se calcula?</summary><div class="calc-body">' +
    row('Cobertura · 40 %', a.cov, 'Parte de la vida del auto, desde su primera inscripción, sin vacíos de más de 12 meses o 15.000 km.') +
    row('Verificación · 35 %', a.ver, 'Respaldo de cada registro: taller adherido con boleta 100 %, revisión técnica 70 %, declarado por el dueño 10 %.') +
    row('Mantenciones · 25 %', a.mant, a.mantCount + ' de ' + a.mantEsperadas + ' esperadas (una cada 10.000 km o cada 12 meses).') +
    (a.desc ? '<p class="calc-desc">Descuentos: −' + a.desc + ' puntos por ' + partes.join(' y ') + '.</p>' : '') +
    '</div></details>';
}

}
const gapItem = (g, v) => '<li class="tl-gap"><div class="gap-card">' + ic('calx') + '<div><p class="gap-t">' + gapTexto(g, v) + '</p><p class="gap-s">' + gapDetalle(g) + '</p></div></div></li>';

function timelineHTML(v, a, unlocked) {
  const porHasta = new Map(); let cola = null;
  a.gaps.forEach(g => { if (g.hasta) porHasta.set(g.hasta, g); else cola = g; });
  const items = [];
  if (cola) items.push(gapItem(cola, v));
  for (let i = a.evs.length - 1; i >= 0; i--) {
    const e = a.evs[i];
    items.push(evItem(e, a, unlocked));
    if (porHasta.has(e)) items.push(gapItem(porHasta.get(e), v));
  }
  items.push('<li class="tl-ins"><span class="ins-dot" aria-hidden="true"></span><p><b>Primera inscripción</b> · ' + fechaIns(v) + '</p></li>');
  return '<ol class="tl" aria-label="Historial del vehículo">' + items.join('') + '</ol>';
}

let lastFocus = null;
function openModal(title, body, wide) {
  const root = $('#modal-root');

  root.innerHTML = '<div class="modal-backdrop" data-close></div>' +
    '<div class="modal' + (wide ? ' modal--wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
    '<header class="modal-head"><h2 id="modal-title">' + title + '</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">' + ic('x') + '</button></header>' +
    '<div class="modal-body" id="modal-body">' + body + '</div></div>';
  root.hidden = false;
  document.body.classList.add('no-scroll');
  const btn = $('.modal-head .icon-btn', root); if (btn) btn.focus({ preventScroll: true });
}
function closeModal() {
  const root = $('#modal-root');
  if (root.hidden) return;
  root.hidden = true; root.innerHTML = '';
  document.body.classList.remove('no-scroll');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
let toastT = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  requestAnimationFrame(() => t.classList.add('is-on'));
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('is-on'); setTimeout(() => { t.hidden = true; }, 250); }, 2800);
}

function evaluarRetoma(raw) {

function retomaRes(p) {

    '<p>No hay registros de ' + fmtP(p) + ' en Bitácora. Esta consulta no se descontó de tu plan.</p></div></div>';
  const a = analizar(v);
  let cls = 'gap', t, sub = '', razones = [];
  if (!a.evs.length || a.mantCount === 0) {
    t = 'Sin mantenciones documentadas: considera el riesgo en el precio de toma.';
    sub = a.evs.length ? 'Hay registros, pero ninguna mantención respaldada.' : 'Este auto no tiene registros en Bitácora. Nada respalda cómo se cuidó.';
  } else if (a.score >= 75 && !a.incons.length) {
    cls = 'ok'; t = 'Historial documentado: respalda un mejor precio de venta.';
    sub = 'Índice ' + a.score + '/100, con ' + a.nTaller + ' servicios verificados por talleres y ' + a.nPrt + ' revisiones técnicas. Al venderlo puedes emitir su Certificado Bitácora.';
  } else {
    t = 'Historial incompleto: considera el riesgo en el precio de toma.';
    sub = 'Índice ' + a.score + '/100. Lo que falta:';
    if (a.mant < 0.75) razones.push('Solo ' + a.mantCount + ' de ' + a.mantEsperadas + ' mantenciones esperadas están documentadas.');
    a.gaps.forEach(g => razones.push(gapTexto(g, v) + ' (' + mesesTxt(g.meses) + ').'));
    if (a.incons.length) razones.push('Kilometraje inconsistente: posible adulteración del odómetro.');
    if (a.nDueno > a.nTaller) razones.push('La mayoría de los registros los declaró el dueño, sin respaldo.');
  }
  let extra = '';
  a.siniestros.forEach(s => { extra += '<p class="veredicto-risk">' + ic('alert') + '<span>Siniestro registrado el ' + fecha(s.fecha) + ': revisa la reparación estructural y descuéntalo del precio de toma.</span></p>'; });
  return '<div class="veredicto veredicto--' + cls + '"><span class="alert-ic">' + ic(cls === 'ok' ? 'shield' : 'alert') + '</span><div>' +
    '<p class="veredicto-t">' + t + '</p><p>' + sub + '</p>' + (razones.length ? '<ul>' + razones.map(r => '<li>' + r + '</li>').join('') + '</ul>' : '') + extra + tomaHTML(v, a) + '</div></div>' +

/* Bitácora Insights (plan Pro, simulado): precios sugeridos y días en stock */
const redondear = n => Math.round(n / 10000) * 10000;
function valorRef(v) {
  if (v.mercado) return { valor: v.mercado, estimado: false };
  const edad = Math.max(0, new Date().getFullYear() - v.anio);
  return { valor: Math.max(2500000, Math.round(14000000 * Math.pow(0.9, edad) / 100000) * 100000), estimado: true };
}
// Índice 0 → −12 %, índice 100 → +5 %; un siniestro registrado resta 8 %
const factorIndice = a => (0.88 + 0.17 * a.score / 100) * (a.siniestros.length ? 0.92 : 1);
function rangoPrecio(v, a, desde, hasta) { const c = valorRef(v).valor * factorIndice(a); return [redondear(c * desde), redondear(c * hasta)]; }
const rangoVenta = (v, a) => rangoPrecio(v, a, 0.97, 1.03);
const rangoToma = (v, a) => rangoPrecio(v, a, 0.80, 0.86);
const rangoTxt = r => clp(r[0]) + ' – ' + clp(r[1]);
const fechaIngreso = dias => { const d = new Date(); d.setDate(d.getDate() - dias); return fecha(toISO(d)); };

function tomaHTML(v, a) {
  if (!planActual().insights) {
    return '<div class="toma toma--lock">' + ic('lock') + '<p>Precio de toma sugerido: disponible en Pro con Bitácora Insights.</p>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="plan" data-id="pro">Cambiar a Pro</button></div>';
  }
  const notas = ['según el índice ' + a.score + '/100'];
  if (a.siniestros.length) notas.push('con −8 % por el siniestro');
  if (valorRef(v).estimado) notas.push('sobre un valor de mercado estimado');
  return '<div class="toma">' + ic('trend') + '<p><span>Precio de toma sugerido: <b>' + rangoTxt(rangoToma(v, a)) + '</b></span>' +
    '<small>Bitácora Insights, ' + notas.join(', ') + '. Simulado.</small></p></div>';
}
function panelInsights() {
  if (!planActual().insights) {
    const pro = PLANES.find(x => x.id === 'pro');
    return '<div class="card msg ins-lock"><span class="msg-ic">' + ic('lock') + '</span><div class="msg-body">' +
      '<h2>Bitácora Insights es parte del plan Pro</h2>' +
      '<p>Ve cuántos días lleva cada auto en stock, un rango de precio sugerido según su índice de trazabilidad y una alerta cuando un auto pasa los ' + DIAS_SOBRESTOCK + ' días sin venderse. En Evaluar retoma suma un precio de toma sugerido.</p>' +
      '<div class="row"><button type="button" class="btn btn-primary btn-lg" data-action="plan" data-id="pro">Cambiar a Pro</button></div>' +
      '<p class="fine">Pro: ' + pro.uf + ' UF al mes + IVA (≈ ' + clp(pro.uf * UF_REF) + '). Cambio simulado.</p></div></div>';
  }
  const rows = STOCK.map(p => { const v = getVeh(p), a = analizar(v); return { v: v, a: a, r: rangoVenta(v, a), dias: v.dias || 0 }; });
  const sobre = rows.filter(x => x.dias > DIAS_SOBRESTOCK).length;
  const prom = Math.round(rows.reduce((s, x) => s + x.dias, 0) / rows.length);
  const sobreRango = rows.filter(x => x.v.precio > x.r[1]).length;
  return '<div class="stock-sum"><div><b>' + prom + ' días</b><span>promedio en stock</span></div>' +
    '<div><b class="' + (sobre ? 'tx-gap' : '') + '">' + sobre + '</b><span>con más de ' + DIAS_SOBRESTOCK + ' días</span></div>' +
    '<div><b>' + sobreRango + '</b><span>sobre el rango sugerido</span></div></div>' +
    '<ul class="ins-list">' + rows.map(insightItem).join('') + '</ul>' +
    '<p class="fine planes-nota">' + ic('info') + '<span>Datos simulados. El rango parte de un valor de mercado de referencia del modelo y año, y se ajusta según el índice de trazabilidad: −12 % con índice 0 y +5 % con índice 100. Un siniestro registrado resta 8 %. En cada barra, la franja es el rango sugerido y la línea es el precio publicado.</span></p>';
}
function insightItem(x) {
  const v = x.v, a = x.a, r = x.r, p = v.precio, sobre = x.dias > DIAS_SOBRESTOCK;
  let pos, cls;

function codigoCert(p) { return 'BTC-' + p + '-' + (hashStr(p + 'bitacora') % 65536).toString(16).toUpperCase().padStart(4, '0'); }
function qrSVG(seed) {
  const N = 25; let x = hashStr(seed) || 1;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  const enFinder = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);
  let d = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!enFinder(r, c) && rnd() < 0.47) d += 'M' + c + ' ' + r + 'h1v1h-1z';

  return '<svg class="qr" viewBox="-2 -2 ' + (N + 4) + ' ' + (N + 4) + '" role="img" aria-label="Código QR de verificación (simulado)"><rect x="-2" y="-2" width="' + (N + 4) + '" height="' + (N + 4) + '" fill="#fff"/>' +
    '<path fill="#0F2328" fill-rule="evenodd" d="' + f(0, 0) + f(0, N - 7) + f(N - 7, 0) + '"/><path fill="#0F2328" d="' + d + '"/></svg>';

    if (!$('#t-foto-area')) return;
    area.innerHTML = '<div class="ot-wrap"><div class="ot-prev"><img src="' + url + '" alt="Foto de la orden de trabajo"></div>' +
      '<div class="ot-ok"><b>' + ic('check') + 'Orden leída</b><small class="muted">' + d.rep.length + ' repuestos, mano de obra y total detectados</small>' +
      '<label class="link-btn" for="t-foto">Cambiar foto</label></div></div>';
    $('#st2').classList.add('is-done');
    const set = (id, val) => { const el = $('#' + id); el.value = val; el.classList.add('ai'); el.classList.remove('is-err'); };
    set('t-fecha', fecha(HOY)); set('t-km', miles(d.km)); set('t-tipo', 'mant'); set('t-monto', clp(d.total));
    set('t-desc', d.desc); set('t-rep', d.rep.map(r => r[0]).join('\n'));
    $('#t-err').hidden = true;
    revisarKm();
    const st3 = $('#st3'); st3.hidden = false;
    scrollToEl(st3);
  }, 2000));
}
function revisarKm() {
  const w = $('#t-km-warn'); if (!w) return;
  const p = tPatente(), v = getVeh(p), km = parseNum($('#t-km').value);
  if (!v || !km) { w.hidden = true; return; }
  const a = analizar(v);
  if (a.evs.length && km < a.maxKm) { w.textContent = 'Es menor al último registro (' + kms(a.maxKm) + '). Revisa el odómetro antes de confirmar.'; w.hidden = false; }
  else w.hidden = true;
}
function dictar() {
  const box = $('#t-voz'); if (!box || tf.rec) return;
  iniciarTimer();
  let s = 0;
  box.innerHTML = '<div class="rec" role="status"><span class="rec-dot" aria-hidden="true"></span><span class="rec-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="t-rec-t">0:00</span>' +
    '<button type="button" class="btn btn-ghost btn-sm" data-action="t-parar">Detener</button></div>';
  tf.rec = setInterval(() => { s++; const t = $('#t-rec-t'); if (t) t.textContent = '0:' + pad(s); if (s >= 4) pararDictado(); }, 1000);
}
function pararDictado() {
  clearInterval(tf.rec); tf.rec = null;
  const box = $('#t-voz'); if (!box) return;
  box.innerHTML = '<div class="rec"><span class="spin spin--sm"></span><span>Transcribiendo nota de voz…</span></div>';
  tf.timers.push(setTimeout(() => {
    const ta = $('#t-nota'), b = $('#t-voz'); if (!ta || !b) return;
    const nota = 'Pastillas de freno delanteras al 30 %, recomendar cambio en la próxima visita. Neumáticos en buen estado.';
    ta.value = ta.value.trim() ? ta.value.trim() + ' ' + nota : nota;
    ta.classList.add('ai');
    b.innerHTML = vozBtnHTML(true);
  }, 900));
}
function errReg(msg, id) {
  const e = $('#t-err'); e.innerHTML = ic('alert') + '<span>' + msg + '</span>'; e.hidden = false;
  if (id) { const el = $('#' + id); if (el) { el.classList.add('is-err'); el.focus(); } }
}
function confirmarRegistro() {
  $$('#f-reg .is-err').forEach(el => el.classList.remove('is-err'));
  $('#t-err').hidden = true;
  const p = tPatente();
  if (!validP(p)) return errReg('Revisa la patente: debe tener el formato AB·CD·12 o AB·12·34.', 't-patente');
  let v = getVeh(p), creado = null;
  if (!v) {
    const marca = $('#t-marca').value.trim(), modelo = $('#t-modelo').value.trim(), anio = parseNum($('#t-anio').value);
    const maxAnio = new Date().getFullYear() + 1;
    if (!marca) return errReg('Falta la marca del auto.', 't-marca');
    if (!modelo) return errReg('Falta el modelo del auto.', 't-modelo');
    if (!anio || anio < 1980 || anio > maxAnio) return errReg('Revisa el año del auto (entre 1980 y ' + maxAnio + ').', 't-anio');
    creado = { patente: p, marca: marca, modelo: modelo, anio: anio, color: 'Sin informar', inscripcion: anio + '-01-01', insAprox: true };
  }
  const f = parseFecha($('#t-fecha').value);
  if (!f) return errReg('Revisa la fecha: usa el formato dd-mm-aaaa.', 't-fecha');
  if (f > HOY) return errReg('La fecha no puede ser posterior a hoy.', 't-fecha');
  const km = parseNum($('#t-km').value);
  if (!km) return errReg('Ingresa el kilometraje que marca el odómetro.', 't-km');
  const desc = $('#t-desc').value.trim();
  if (!desc) return errReg('Describe el trabajo realizado.', 't-desc');
  const antes = v ? analizar(v).score : 0;
  if (creado) { S.extraVeh[p] = creado; v = creado; }
  const tipo = $('#t-tipo').value;
  const ev = {
    id: 'n' + Date.now(), fecha: f, km: km, tipo: tipo, sello: 'taller', taller: MI_TALLER, desc: desc,
    rep: $('#t-rep').value.split('\n').map(s => s.trim()).filter(Boolean), monto: parseNum($('#t-monto').value),
    nota: $('#t-nota').value.trim() || null, nuevo: true, creado: Date.now()
  };
  if (tipo === 'sin') ev.resumen = desc.replace(/\.$/, '');
  if (!S.extra[p]) S.extra[p] = [];
  S.extra[p].push(ev);
  S.registrosMes++;
  guardar();
  const despues = analizar(v).score;
  const ms = pararTimer();
  $('#f-reg').hidden = true;
  const ex = $('#t-exito');
  ex.innerHTML = '<div class="exito"><span class="exito-ic">' + ic('check') + '</span>' +
    '<h2>Servicio registrado' + (ms ? ' en ' + fmtT(ms) : '') + '</h2>' +
    '<div class="exito-veh">' + plateHTML(p, 'sm') + '<span>' + esc(nombreVeh(v)) + ' ' + v.anio + '</span></div>' +
    '<p>Ya aparece en el historial del auto con el sello ' + selloHTML('taller') + '</p>' +
    '<p class="exito-idx">Índice de trazabilidad: <b>' + antes + '</b> → <b class="tx-ok">' + despues + '</b></p>' +
    '<div class="row"><button type="button" class="btn btn-primary" data-action="ver-como" data-rol="comprador" data-p="' + p + '">' + ic('search') + 'Ver como comprador</button>' +
    '<button type="button" class="btn btn-ghost" data-action="ver-como" data-rol="automotora" data-p="' + p + '">' + ic('store') + 'Ver como automotora</button></div>' +
    '<button type="button" class="link-btn" data-action="t-otro">Registrar otro servicio</button></div>';
  ex.hidden = false;
  $('#t-timer').innerHTML = ic('clock') + '<span>' + fmtT(ms) + '</span>';
  scrollToEl($('#reg'));
  const g = $('#ganas'); if (g) g.innerHTML = ganasHTML();
  const r = $('#t-registros'); if (r) r.innerHTML = registrosHTML();
}
function ganasHTML() {
  const leads = S.leads.concat(LEADS_BASE).slice(0, 4);
  return '<h2>Lo que ganas con Bitácora</h2>' +
    '<div class="ganas-hero"><b>' + derivados() + '</b><div><p class="ganas-t">clientes derivados este mes</p><p>Llegaron a tu taller desde una consulta en Bitácora.</p></div></div>' +
    '<ul class="ganas-list">' +
    '<li>' + ic('star') + '<div><b>Taller recomendado en ' + TALLERES[MI_TALLER].comuna + '</b><span>Apareces 2° en “Talleres Bitácora cerca” para los compradores de tu zona.</span></div></li>' +
    '<li>' + ic('receipt') + '<div><b>' + S.registrosMes + ' servicios registrados este mes</b><span>Cada registro deja tu nombre en el historial del auto.</span></div></li></ul>' +
    '<p class="ganas-msg">Registrar te trae clientes: cuando un auto que atendiste se vende, el nuevo dueño ve quién lo cuidó y vuelve a tu taller.</p>' +
    '<h3 class="mini-h">Solicitudes recientes</h3><ul class="leads">' +
    leads.map(l => '<li class="lead-it"><b>' + esc(l.tipo) + (l.nuevo ? '<span class="nuevo">Nuevo</span>' : '') + '</b><span>' + esc(l.veh) + (l.patente ? ' · ' + fmtP(l.patente) : '') + ' · ' + fecha(l.fecha) + '</span><span>' + esc(l.origen) + '</span></li>').join('') +
    '</ul>';
}
function registrosHTML() {
  const out = [], vistos = {};
  Object.keys(BASE).concat(Object.keys(S.extra), Object.keys(S.extraVeh)).forEach(p => {
    if (vistos[p]) return; vistos[p] = true;
    eventosDe(p).forEach(e => { if (e.taller === MI_TALLER) out.push({ p: p, e: e }); });
  });
  out.sort((x, y) => (y.e.fecha < x.e.fecha ? -1 : y.e.fecha > x.e.fecha ? 1 : (y.e.creado || 0) - (x.e.creado || 0)));
  return '<h2>Mis últimos registros</h2><ul class="reg-list">' + out.slice(0, 6).map(o => {
    const v = getVeh(o.p);
    return '<li class="reg-it">' + plateHTML(o.p, 'sm') + '<div class="ri-main"><b>' + esc(v ? nombreVeh(v) : '') + (o.e.nuevo ? '<span class="nuevo">Nuevo</span>' : '') + '</b><span>' + TIPOS[o.e.tipo].label + ' · ' + kms(o.e.km) + '</span></div>' +
      '<div class="ri-side">' + (o.e.monto != null ? '<b>' + clp(o.e.monto) + '</b>' : '') + fecha(o.e.fecha) + '</div></li>';
  }).join('') + '</ul>';
}
function resetRegistro() {
  limpiarTaller();
  const r = $('#reg'); if (r) r.innerHTML = regHTML();
  const i = $('#t-patente'); if (i) i.focus();
}

/* ================= Navegación ================= */
const VISTAS = ['comprador', 'automotora', 'taller'];
let vista = 'inicio', pendiente = null;
function route() {
  const h = location.hash.replace('#', '');
  vista = VISTAS.indexOf(h) >= 0 ? h : 'inicio';
  limpiarTaller();
  closeModal();
  document.body.classList.remove('has-paybar');
  const app = $('#app');
  app.innerHTML = vista === 'comprador' ? viewComprador() : vista === 'automotora' ? viewAutomotora() : vista === 'taller' ? viewTaller() : viewInicio();
  document.body.dataset.vista = vista;
  $$('.seg button').forEach(b => { if (b.dataset.go === vista) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
  const pend = pendiente; pendiente = null;
  if (vista === 'comprador') {
    if (pend && pend.p) { cPatente = pend.p; $('#c-patente').value = fmtP(pend.p); }
    if (cPatente) mostrarComprador(cPatente);
    if (pend && pend.p) { const n = $('.ev--nuevo') || $('#c-res'); setTimeout(() => scrollToEl(n), 60); }
  } else if (vista === 'automotora' && pend && pend.p) {
    if (STOCK.indexOf(pend.p) >= 0) { aTab = 'stock'; refreshAuto(); abrirHistorial(pend.p); }
    else { aTab = 'retoma'; refreshAuto(); $('#r-patente').value = fmtP(pend.p); evaluarRetoma(pend.p); setTimeout(() => scrollToEl($('#r-res')), 60); }
  }
  app.focus({ preventScroll: true });
}
function irA(rol, p) {
  pendiente = p ? { p: p } : null;
  if (location.hash === '#' + rol) route(); else location.hash = rol;
}

/* ================= Eventos ================= */
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-close]')) { closeModal(); return; }
  const up = t.closest('#t-upload');
  if (up) { const ok = puedeFoto(); if (ok !== true) { ev.preventDefault(); avisarFoto(ok); } else iniciarTimer(); return; }
  const go = t.closest('[data-go]');
  if (go) { irA(go.dataset.go); return; }
  const el = t.closest('[data-action]'); if (!el) return;
  const d = el.dataset;
  switch (d.action) {
    case 'buscar': $('#c-patente').value = fmtP(d.p); mostrarComprador(d.p); break;
    case 'limpiar': { const i = $('#c-patente'); i.value = ''; mostrarComprador(''); i.focus(); break; }
    case 'pago': abrirPago(d.p); break;
    case 'pagar': pagar(d.p, el); break;
    case 'ver-completo': closeModal(); mostrarComprador(d.p); setTimeout(() => scrollToEl($('.hist')), 40); break;
    case 'talleres': abrirTalleres(d.p); break;
    case 'precompra': pedirPrecompra(d.t, d.p); break;
    case 'tab': aTab = d.tab; closeModal(); refreshAuto(); break;
    case 'historial': abrirHistorial(d.p); break;
    case 'certificar': certificar(d.p); break;
    case 'copiar': copiarTexto(d.p); break;
    case 'imprimir': imprimir(); break;
    case 'evaluar': $('#r-patente').value = fmtP(d.p); evaluarRetoma(d.p); break;
    case 'plan': {
      S.plan = d.id; rMsg = ''; guardar();
      const app = $('#app'); app.innerHTML = viewAutomotora();
      if (aTab === 'retoma' && rIntento) { const p = rIntento; rIntento = ''; $('#r-patente').value = fmtP(p); evaluarRetoma(p); }
      toast('Ahora tienes el plan ' + planActual().nombre + ' (simulado)');
      break;
    }
    case 't-ejemplo': { const i = $('#t-patente'); i.value = fmtP(d.p); iniciarTimer(); actualizarTVeh(); break; }
    case 't-foto-ejemplo': {
      if (!$('#t-patente').value.trim()) { $('#t-patente').value = fmtP('KZPW38'); actualizarTVeh(); }
      const ok = puedeFoto(); if (ok !== true) { avisarFoto(ok); break; }
      const p = tPatente(); leerFoto(otSVG(p, propuestaIA(p))); break;
    }
    case 't-dictar': dictar(); break;
    case 't-parar': pararDictado(); break;
    case 't-otro': resetRegistro(); break;
    case 'ver-como': closeModal(); irA(d.rol, d.p); break;
    case 'reset': {
      const label = $('span', el);
      if (!el.dataset.armed) {
        el.dataset.armed = '1'; label.textContent = 'Toca de nuevo para confirmar';
        setTimeout(() => { delete el.dataset.armed; label.textContent = 'Reiniciar demo'; }, 4000);
        break;
      }
      delete el.dataset.armed; label.textContent = 'Reiniciar demo';
      S = estadoInicial();
      try { localStorage.removeItem(KEY); } catch (e) { /* ignorar */ }
      cPatente = ''; rPatente = ''; rMsg = ''; rIntento = ''; aTab = 'stock';
      route(); toast('Demo reiniciada: se borraron los cambios de esta sesión');
      break;
    }
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'f-buscar') mostrarComprador($('#c-patente').value);
  else if (f.id === 'f-retoma') evaluarRetoma($('#r-patente').value);
  else if (f.id === 'f-reg') confirmarRegistro();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('.plate-input input')) {
    const f = fmtP(t.value); if (t.value !== f) t.value = f;
    if (t.id === 't-patente') { iniciarTimer(); actualizarTVeh(); }
  }
  if (t.classList.contains('ai')) t.classList.remove('ai');
  if (t.classList.contains('is-err')) t.classList.remove('is-err');
  if (t.id === 't-km') revisarKm();
});
document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (t.id === 't-km' || t.id === 't-monto') {
    const n = parseNum(t.value);
    if (n != null) t.value = t.id === 't-km' ? miles(n) : clp(n);
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 't-foto' && t.files && t.files[0]) {
    const ok = puedeFoto();
    if (ok !== true) { avisarFoto(ok); t.value = ''; return; }
    leerFoto(URL.createObjectURL(t.files[0]));
    t.value = '';
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', route);
route();
})();
</script>

</body></html>
